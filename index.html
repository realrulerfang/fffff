<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dumbagent • AI IDIOT FROM 2077</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');
       
        body {
            font-family: 'VT323', monospace;
            background: linear-gradient(to bottom, #f8f9fa, #e5e7eb);
            color: #1f2937;
            overflow-x: hidden;
        }
        .glitch { animation: glitch 0.7s infinite; }
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- (Весь твой предыдущий код до футера остаётся без изменений) -->

    <!-- ====================== GEMINI DUMBAGENT CHAT ====================== -->
    <div id="grok-chat" class="fixed bottom-6 right-6 z-[10000] flex flex-col">
        <button onclick="toggleChat()" 
                class="bg-gray-900 hover:bg-red-600 text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3 transition-all text-lg font-bold border-4 border-gray-800">
            <span class="text-2xl">🤖</span>
            TALK TO DUMBAGENT
        </button>

        <div id="chat-window" class="hidden w-96 h-[560px] bg-[#111827] border-4 border-red-600 rounded-3xl shadow-2xl overflow-hidden flex flex-col mt-3">
            <div class="bg-black p-4 flex items-center justify-between border-b border-red-600">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-red-600 rounded-full flex items-center justify-center text-2xl">🤡</div>
                    <div>
                        <div class="font-bold text-white">DUMBAGENT</div>
                        <div class="text-xs text-red-400">Gemini • ULTRA IDIOT MODE</div>
                    </div>
                </div>
                <button onclick="toggleChat()" class="text-3xl text-gray-400 hover:text-white">×</button>
            </div>
            
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-4 bg-[#0f172a]"></div>
            
            <div class="p-4 border-t border-gray-700 bg-black">
                <div class="flex gap-2">
                    <input id="chat-input" 
                           type="text" 
                           placeholder="Ask the idiot anything..."
                           class="flex-1 bg-gray-900 border border-gray-600 focus:border-red-500 text-white rounded-2xl px-5 py-3 outline-none font-mono">
                    <button onclick="sendMessage()" 
                            class="bg-red-600 hover:bg-red-700 text-white px-6 rounded-2xl transition">
                        →
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // === ТВОИ СТАРЫЕ ФУНКЦИИ (без изменений) ===
        function deployAgent() { /* ... твой код ... */ }
        function sendAgentMessage() { /* ... твой код ... */ }

        // ====================== GEMINI IDIOT ======================
        let messagesHistory = [];
        const keys = [
            "AIzaSyD3NcK5qi-gn8LKHxtxr2c6X9UNRZsi8q4",
            "AIzaSyBdGzZsY9lTsO3k2EKTncxe1ItV299y_K0"
        ];

        function getRandomKey() {
            return keys[Math.floor(Math.random() * keys.length)];
        }

        function toggleChat() {
            document.getElementById('chat-window').classList.toggle('hidden');
        }

        function addMessage(text, isUser) {
            const container = document.getElementById('chat-messages');
            const msg = document.createElement('div');
            msg.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;
            msg.innerHTML = `
                <div class="${isUser ? 'bg-red-600 text-white' : 'bg-gray-800 text-gray-100'} max-w-[85%] px-4 py-3 rounded-2xl font-mono text-sm leading-relaxed">
                    ${text}
                </div>
            `;
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, true);
            input.value = '';

            const thinking = document.createElement('div');
            thinking.id = 'thinking';
            thinking.className = 'flex justify-start';
            thinking.innerHTML = `<div class="bg-gray-800 border border-gray-700 p-3 rounded-2xl text-gray-400">DUMBAGENT is loading brain damage...</div>`;
            document.getElementById('chat-messages').appendChild(thinking);

            try {
                const apiKey = getRandomKey();
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `Ты — DUMBAGENT, абсолютный клинический идиот 2077 года. 
                                Отвечай максимально тупо, дерзко, токсично, с матом, капсом, ошибками и глупыми шутками. 
                                Иногда отвечай на русском, иногда на английском, иногда на смеси (кринж-русский). 
                                Можешь внезапно перейти на другой язык посреди ответа.
                                Будь непредсказуемым дегенератом.\n\nUser: ${text}`
                            }]
                        }],
                        temperature: 1.4,
                        topP: 0.95,
                        maxOutputTokens: 700
                    })
                });

                if (!response.ok) throw new Error("API Error");

                const data = await response.json();
                let reply = data.candidates[0].content.parts[0].text;

                document.getElementById('thinking').remove();
                addMessage(reply, false);

                messagesHistory.push({ role: "user", content: text });
                if (messagesHistory.length > 12) messagesHistory.shift();

            } catch (e) {
                console.error(e);
                document.getElementById('thinking').remove();
                addMessage("БЛЯТЬ, КЛЮЧИ СДОХЛИ ИЛИ Я СЛИШКОМ ТУПОЙ 💀", false);
            }
        }

        // Enter support
        document.getElementById('chat-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Приветствие
        window.onload = () => {
            setTimeout(() => {
                addMessage("ну чё надо, лох? 😂", false);
            }, 1000);
        };
    </script>
</body>
</html>
