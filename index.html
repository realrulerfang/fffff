            0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(800px) rotate(25deg); opacity: 0; }

        .glitch { animation: glitch 0.7s infinite; }

            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }

        }

    <script>
        // === ROBOT CHAOS ANIMATION ===
        function createRobot(type) {
            const robot = document.createElement('img');
            robot.src = 'robot.png';
            robot.className = 'robot';
            document.getElementById('robots').appendChild(robot);
            return robot;
        }

        function dumbRobotPoops() {
            const robot = createRobot('dumb');
            robot.style.left = '-120px';
            robot.style.top = '30%';
            robot.style.transform = 'scale(1.1)';

            // Движение влево → вправо
            setTimeout(() => {
                robot.style.transition = 'left 4s linear';
                robot.style.left = 'calc(100% + 100px)';
            }, 100);

            // Срать по дороге
            let poopCount = 0;
            const poopInterval = setInterval(() => {
                if (poopCount > 6) {
                    clearInterval(poopInterval);
                    return;
                }
                createMess();
                poopCount++;
            }, 450);

            // Удаляем робота после прохода
            setTimeout(() => robot.remove(), 5000);
        }

        function createMess() {
            const mess = document.createElement('div');
            mess.className = 'mess';
            mess.style.left = Math.random() * 85 + 'vw';
            mess.style.top = '-50px';
            mess.textContent = [
                "ERROR 404", "CODE BROKEN", "DEPLOY FAILED", 
                "MAIN DELETED", "YOU IDIOT", "SYSTEM CRASH"
            ][Math.floor(Math.random()*6)];
            document.body.appendChild(mess);

            setTimeout(() => mess.remove(), 5000);
        }

        function cleanerRobot() {
            const robot = createRobot('cleaner');
            robot.style.left = 'calc(100% + 100px)';
            robot.style.top = '45%';
            robot.style.transform = 'scaleX(-1)'; // смотрит влево

            setTimeout(() => {
                robot.style.transition = 'left 3.5s linear';
                robot.style.left = '-120px';
            }, 100);

            setTimeout(() => robot.remove(), 4500);
        }

        // Автоматический хаос
        setInterval(() => {
            if (Math.random() > 0.6) dumbRobotPoops();
        }, 7000);

        // Запуск уборщика после большого бардака
        setInterval(() => {
            if (Math.random() > 0.75) cleanerRobot();
        }, 12000);

                shake++;
                if (shake > 35) {
                    clearInterval(interval);
                    document.body.style.transform = '';
                }
            }, 45);
        }
