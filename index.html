<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dumbagent • AI IDIOT FROM 2077</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

body {
    font-family: 'VT323', monospace;
    background: linear-gradient(to bottom, #f8f9fa, #e5e7eb);
    overflow-x: hidden;
}

/* ================= ROBOTS ================= */

#robot-scene {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 260px;
    pointer-events: none;
    z-index: 9999;
}

.robot {
    position: absolute;
    bottom: 0;
    width: 200px;
    transition: all 0.8s ease;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));
}

#chaos {
    left: -250px;
}

#cleaner {
    right: -300px;
    width: 240px;
}

#poop {
    position: absolute;
    bottom: 40px;
    left: 28%;
    width: 80px;
    opacity: 0;
    transform: scale(0);
    transition: all .3s ease;
}

.show {
    opacity: 1 !important;
    transform: scale(1) !important;
}

.shake {
    animation: shake .15s infinite;
}

@keyframes shake {
    0% { transform: rotate(-2deg); }
    50% { transform: rotate(2deg); }
    100% { transform: rotate(-2deg); }
}

/* speech */
.speech {
    position: absolute;
    top: -50px;
    left: 40px;
    background: white;
    border: 3px solid #111;
    padding: 6px 12px;
    font-weight: bold;
    opacity: 0;
    transition: .2s;
}
.speech.show {
    opacity: 1;
    transform: translateY(-5px);
}
</style>
</head>

<body>

<!-- ================= ROBOTS ================= -->
<div id="robot-scene">

    <img id="poop" src="poop.png">

    <div id="chaosWrap" style="position:absolute;bottom:0;">
        <div id="chaosSpeech" class="speech">...</div>
        <img id="chaos" class="robot" src="chaos_idle.png">
    </div>

    <div id="cleanWrap" style="position:absolute;bottom:0;right:0;">
        <div id="cleanSpeech" class="speech">...</div>
        <img id="cleaner" class="robot" src="cleaner_idle.png">
    </div>

</div>

<!-- ================= YOUR SITE ================= -->

<div class="pt-32 text-center">
    <h1 class="text-6xl font-bold">DUMBAGENT</h1>
    <p class="mt-4 text-xl">AUTONOMOUS CHAOS ENGINE</p>

    <button onclick="deploy()" class="mt-10 px-10 py-5 bg-red-600 text-white">
        DEPLOY AGENT
    </button>
</div>

<script>

const chaos = document.getElementById("chaos");
const cleaner = document.getElementById("cleaner");
const poop = document.getElementById("poop");

const chaosSpeech = document.getElementById("chaosSpeech");
const cleanSpeech = document.getElementById("cleanSpeech");

function reset() {
    chaos.style.left = "-250px";
    cleaner.style.right = "-300px";

    poop.classList.remove("show");
    chaos.classList.remove("shake");
    cleaner.classList.remove("shake");

    chaosSpeech.classList.remove("show");
    cleanSpeech.classList.remove("show");

    chaos.src = "chaos_idle.png";
    cleaner.src = "cleaner_idle.png";
}

function deploy() {

    reset();

    // enter
    setTimeout(() => {
        chaos.style.left = "18%";
    }, 600);

    // speak
    setTimeout(() => {
        chaosSpeech.innerText = "hehe";
        chaosSpeech.classList.add("show");
    }, 2000);

    // poop
    setTimeout(() => {
        chaos.src = "chaos_poop.png";
        poop.classList.add("show");
        chaosSpeech.innerText = "oops";
    }, 3200);

    // panic run
    setTimeout(() => {
        chaos.src = "chaos_run1.png";
        chaos.classList.add("shake");
        chaosSpeech.innerText = "RUN";
    }, 4600);

    setTimeout(() => {
        chaos.src = "chaos_run2.png";
        chaos.style.left = "120%";
    }, 5200);

    // cleaner
    setTimeout(() => {
        cleaner.style.right = "18%";
        cleaner.src = "cleaner_clean.png";
        cleanSpeech.innerText = "cleaning...";
        cleanSpeech.classList.add("show");
        cleaner.classList.add("shake");
    }, 6800);

    // cleanup
    setTimeout(() => {
        poop.classList.remove("show");
    }, 9000);

    setTimeout(() => {
        cleaner.style.right = "-300px";
    }, 11000);
}

deploy();
setInterval(deploy, 14000);

</script>

</body>
</html>
